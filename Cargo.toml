[package]
name = "rstorch"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = "0.5"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
matrixmultiply = { version = "0.3", optional = true }

[features]
blas = ["matrixmultiply"]

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
ptr_arg = "allow"
type_complexity = "allow"
excessive_precision = "allow"
manual_div_ceil = "allow"
len_without_is_empty = "allow"

[[bench]]
name = "matmul_bench"
harness = false

[[bench]]
name = "conv_bench"
harness = false

[[bench]]
name = "im2col_bench"
harness = false

[[bench]]
name = "matmul_simd_bench"
harness = false