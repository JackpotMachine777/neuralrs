[package]
name = "neuralrs"
version = "0.1.0"
edition = "2024"
description = "A deep learning library written from scratch in Rust — autograd, CNNs, RNNs, and Transformers"
license = "Apache-2.0"
repository = "https://github.com/JackpotMachine777/neuralrs"
readme = "README.md"
keywords = ["deep-learning", "machine-learning", "autograd", "neural-network", "transformer"]
categories = ["science"]

[dev-dependencies]
criterion = "0.5"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
matrixmultiply = { version = "0.3", optional = true }
cudarc = { version = "0.19", features = ["cuda-version-from-build-system"], optional = true }

[features]
blas = ["matrixmultiply"]
cuda = ["dep:cudarc"]

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
ptr_arg = "allow"
type_complexity = "allow"
excessive_precision = "allow"
manual_div_ceil = "allow"
len_without_is_empty = "allow"

[[bench]]
name = "matmul_bench"
harness = false

[[bench]]
name = "conv_bench"
harness = false

[[bench]]
name = "im2col_bench"
harness = false

[[bench]]
name = "matmul_simd_bench"
harness = false