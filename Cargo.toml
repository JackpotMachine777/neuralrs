[package]
name = "rstorch"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
criterion = "0.5"

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
matrixmultiply = { version = "0.3", optional = true }

[features]
blas = ["matrixmultiply"]

[[bench]]
name = "matmul_bench"
